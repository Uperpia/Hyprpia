# Config temporanea

# Rende più consistente l'uso con imv
[opener]
imv_folder = [
	{ run = 'sh -c "imv -n \"\$0\" \"\${0%/*}\"" %s', orphan = true, desc = "imv (Cartella Completa)", for = "linux" }
]

# Rende più consistente l'uso con nvim
edit = [
    { run = 'nvim %s', block = true, for = "unix" }
]

[open]
prepend_rules = [
	{ mime = "image/*", use = "imv_folder" }
]



