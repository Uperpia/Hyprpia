# --- Shell ---
shell fish

# --- Font ---
font_family      JetBrains Mono Nerd Font
font_size        12.0
letter_spacing   0
# Kitty gestisce il DPI automaticamente, ma puoi forzare la scala se necessario
# force_ltr no 

# --- Cursore ---
cursor_shape          beam
cursor_beam_thickness 1.5

# --- Scrollback ---
scrollback_lines 10000

# --- Estetica e Trasparenza ---
background_opacity 0.78
# Disabilita il grassetto che usa colori "bright" (come richiesto)
bold_is_bright     no

# --- Padding (Il tocco magico di Foot) ---
window_padding_width 25

# --- Comportamento Finestra ---
# Imposta il titolo iniziale
shell_integration no-title
window_title      kitty

# --- Scorciatoie da tastiera (Key-bindings) ---
# Pulizia dei bind predefiniti (opzionale)
clear_all_shortcuts no

# Scroll
map page_up   scroll_page_up
map page_down scroll_page_down

# Ricerca
# Nota: Kitty non ha una barra di ricerca nativa identica a foot.
# Di default usa un "pager" (solitamente meno o il tuo editor).
# Questo comando apre lo scrollback in una finestra separata per cercare:
map ctrl+shift+f show_scrollback

confirm_os_window_close 0
