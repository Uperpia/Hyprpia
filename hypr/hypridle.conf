# Config del demone che esegue blocco/sospensione schermo per inattività

general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch dpms on
}

listener {
    timeout = 300                          
    on-timeout = loginctl lock-session     
    # Attiva blocco schermo dopo 5 minuti di inattività
}

listener {
    timeout = 60
    on-timeout = pidof hyprlock && hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
    # Spegne lo schermo dopo 1 minuti di inattività se il blocco schermo è attivo 
    # (per quei casi in cui esso venga richiamato tramite terminale o shortcut)
}


listener {
    timeout = 360                                
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
    # Spegne lo schermo dopo 6 minuti di inattività
    # (quindi 1 minuto dopo l'attazione automatica del lock screen)
    # Basta muovere mouse o premere un pulsante per riaccendere
}
