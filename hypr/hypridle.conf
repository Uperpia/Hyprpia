# Config del demone che esegue blocco/sospensione schermo per inattività

general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch dpms on
}

listener {
    timeout = 300                                  # Dopo 5 minuti
    on-timeout = loginctl lock-session             # Blocca la sessione
}

listener {
    timeout = 360                                
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
    # Spegne lo schermo dopo 1 minuto di inattività dal lockscreen
    # Basta muovere mouse o premere un pulsante per riaccendere
}
