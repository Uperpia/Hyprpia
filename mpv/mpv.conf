# Salva la posizione del video alla chiusura
save-position-on-quit=yes

# Avvia la riproduzione automaticamente a schermo intero
fullscreen=yes

# Salva gli screenshot con il formato "Nome_video_NumeroProgressivo"
screenshot-template="%F_%n"

# Salva gli screenshot nella cartella Pictures/mpv
screenshot-directory=~/Pictures/mpv

# Attiva l'accelerazione hardware per alleggerire la CPU e risparmiare batteria
hwdec=auto-safe

# Usa un profilo di rendering di alta qualità (migliora l'upscaling e i colori se hai una GPU dedicata)
profile=gpu-hq

# Seleziona automaticamente l'audio in italiano, o passa all'inglese se assente
alang=ita,it,eng,en

# Seleziona automaticamente i sottotitoli in italiano, poi in inglese
slang=ita,it,eng,en

# Aumenta il tetto massimo del volume (es. 130%) per amplificare i video con audio registrato troppo basso
volume-max=130


